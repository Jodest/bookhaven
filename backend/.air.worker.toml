# air config for the background worker (docker-compose `worker` service).
# Separate binary path from .air.toml so it never collides with the api build.
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
bin = "./tmp/worker"
cmd = "go build -o ./tmp/worker ./cmd/worker"
delay = 1000
exclude_dir = ["assets", "tmp", "vendor", "testdata", "storage"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
# Docker Desktop on Windows/macOS does not forward inotify events across the
# bind mount (./backend:/app), so fsnotify never fires; poll instead.
poll = true
poll_interval = 1000
full_bin = ""
include_dir = []
include_ext = ["go", "tpl", "tmpl", "html"]
kill_delay = "0s"
log = "build-errors-worker.log"
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_root = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
