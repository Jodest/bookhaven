        целевой жанр — target_id или предложенный; если он среди жанров предложения,
        источники — остальные жанры, иначе источниками становятся все жанры предложения.
        Для junk жанр получает статус rejected через массовую смену статуса, target_id
        для junk недопустим (400). Устаревшее предложение (жанр удалён, слит или отклонён)
        не применяется: оно помечается stale, жанры не меняются, 409. 404 — предложение
        не найдено, либо выбранный target_id не найден или уже слит (ничего не меняется);
        409 — предложение не открыто или устарело. Слияние необратимо. Ответ: suggestion,
        merge (результат слияния или null), status_report (отчёт о смене статуса для
        junk или null).'
