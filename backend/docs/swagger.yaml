    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.GenreBulkStatusReport:
    properties:
      errors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_admin_service.GenreBulkStatusRowError'
        type: array
      processed:
        type: integer
      updated:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.GenreBulkStatusRowError:
    properties:
      genre_id:
        type: string
      message:
        type: string
      name:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.ImportCreatedEntity:
    properties:
      id:
        type: string
      name:
        type: string
      row:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.ImportReport:
    properties:
      created:
        type: integer
      created_authors:
        description: |-
          CreatedAuthors / CreatedGenres list every author/genre this import
          created, in creation order, each at most once. Only rows whose book
          was created create authors/genres (a failed or skipped row creates
          nothing), so every entry comes from such a row.
          Always present, never nil.
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_admin_service.ImportCreatedEntity'
        type: array
      created_genres:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_admin_service.ImportCreatedEntity'
        type: array
      errors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_admin_service.ImportRowError'
        type: array
      processed:
        type: integer
      skipped_existing:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.ImportRowError:
    properties:
      message:
        type: string
      row:
        type: integer
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_catalog_transport_http.AuthorResponse:
    properties:
      birth_date:
        type: string
      id:
        type: string
      name:
        type: string
      photo_url:
        type: string
      slug:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_catalog_transport_http.BookListItemResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_catalog_transport_http.AuthorResponse'
        type: array
      cover_url:
        type: string
      genres:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_catalog_transport_http.GenreResponse'
        type: array
      id:
        type: string
      published_year:
        type: integer
      rating:
        type: number
      ratings_count:
        type: integer
      slug:
        type: string
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_catalog_transport_http.GenreResponse:
    properties:
