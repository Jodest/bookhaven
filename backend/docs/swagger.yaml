info:
  contact: {}
  description: Социальный каталог книг для рынка РФ и СНГ. REST API для веб- и админ-приложений
    BookHaven.
  title: BookHaven API
  version: "1.0"
paths:
  /admin/authors:
    get:
      description: Требуется роль admin
      parameters:
      - description: Поиск
        in: query
        name: search
        type: string
      - description: Номер страницы
        in: query
        name: page
        type: integer
      - description: Размер страницы, максимум 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_admin_transport_http.listAuthorsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Список авторов (админ)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Требуется роль admin и Bearer-токен
      parameters:
      - description: Данные автора
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_admin_transport_http.createUpdateAuthorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать автора (админ)
      tags:
      - admin
  /admin/authors/{id}:
    patch:
      consumes:
      - application/json
      description: Требуется роль admin и Bearer-токен
      parameters:
      - description: ID автора
        in: path
        name: id
        required: true
        type: string
      - description: Данные автора
        in: body
        name: body
        required: true
