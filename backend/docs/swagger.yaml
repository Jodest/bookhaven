        лицензии) с атрибуцией. Заполненные значения никогда не перезаписываются.
        Каждый автор обрабатывается независимо: outcome = enriched | unchanged | skipped
        (notes: no_qid, entity_not_found) | error. 502 — только если запрос к Wikidata
        не удался целиком.'
