  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Принимает refresh-токен в теле запроса или в cookie refresh_token.
        Если email пользователя не подтверждён, все его refresh-токены отзываются,
        auth-cookies очищаются и возвращается 401 с кодом email_not_verified.
      parameters:
      - description: Refresh-токен (опционально, можно передать через cookie)
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_modules_auth_transport_http.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'code: email_not_verified | refresh_token_superseded (токен
            ротирован <30с назад, можно повторить один раз); без кода - недействительный
            токен или повторное использование'
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
      summary: Обновить пару токенов
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 'Создаёт пользователя (имя 2-255 символов после обрезки пробелов,
        пароль 8 символов - 72 байта в UTF-8) и отправляет письмо со ссылкой подтверждения
        email. Вход не выполняется и cookies не устанавливаются: войти можно только
        после подтверждения email. Запросы ограничиваются: 10 запросов в час с одного
        IP и 5 в час для одного адреса (считаются и успешные, и ответы 409); при превышении
        - 429 с кодом rate_limited, одинаковый для новых и существующих адресов.'
      parameters:
      - description: Данные регистрации
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_transport_http.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.registerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: 'code: rate_limited'
          headers:
            Retry-After:
              description: Секунд до следующей попытки
              type: integer
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.rateLimitedResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация пользователя
      tags:
      - auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: 'Публичный эндпоинт. Если адрес принадлежит неподтверждённому аккаунту,
        удаляет его неиспользованные ссылки подтверждения и отправляет новую. Ответ
        202 одинаков для любого корректного адреса (неизвестного, уже подтверждённого
        и т.д.), чтобы не раскрывать, какие адреса зарегистрированы. Ограничения:
        20 запросов в час с одного IP; для одного адреса 1 раз в минуту и 5 раз в
        сутки. Коды ошибок: invalid_email, rate_limited, email_send_failed.'
      parameters:
      - description: Email аккаунта
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_transport_http.resendVerificationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: 'status: sent'
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              description: Секунд до следующей попытки
              type: integer
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.rateLimitedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
      summary: Повторно отправить письмо подтверждения email
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: 'Публичный эндпоинт. Устанавливает новый пароль по одноразовому
        токену из письма. Пароль проверяется до токена (8 символов - 72 байта в UTF-8),
        поэтому отклонённый пароль не расходует ссылку. При успехе: токен помечается
        использованным, email считается подтверждённым, все refresh-токены пользователя
        отзываются, auth-cookies очищаются. Вход не выполняется. Коды ошибок: invalid_password,
        invalid_token, token_used, token_expired.'
      parameters:
      - description: Токен из ссылки в письме и новый пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_transport_http.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: password_reset'
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Сбросить пароль
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: 'Подтверждает адрес электронной почты по одноразовому токену из
        письма. Не требует авторизации и не меняет cookies. Коды ошибок: invalid_token,
        token_expired, token_used.'
      parameters:
      - description: Токен из ссылки в письме
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_transport_http.verifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'status: verified или already_verified'
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
      summary: Подтвердить email
      tags:
      - auth
