  internal_modules_admin_transport_http.mergeGenreResponse:
    properties:
      books_reassigned:
        type: integer
      genre:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
    type: object
  internal_modules_admin_transport_http.moderateReviewRequest:
    properties:
      is_hidden:
        type: boolean
