    post:
      consumes:
      - application/json
      description: 'Публичный эндпоинт. Если адрес принадлежит аккаунту с паролем
        (подтверждённому или нет), удаляет его неиспользованные ссылки сброса и отправляет
        письмо с новой ссылкой (действует 1 час, одноразовая). Ответ 202 одинаков
        для любого корректного адреса (неизвестного, без пароля и т.д.), чтобы не
        раскрывать, какие адреса зарегистрированы. Ограничения: 20 запросов в час
        с одного IP; для одного адреса 1 раз в минуту и 5 раз в сутки. Коды ошибок:
        invalid_email, rate_limited, email_send_failed.'
      parameters:
      - description: Email аккаунта
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_transport_http.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "202":
          description: 'status: sent'
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              description: Секунд до следующей попытки
              type: integer
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.rateLimitedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
      summary: Запросить сброс пароля
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Сначала проверяется пароль, затем подтверждение email. Если пароль
        верный, но email не подтверждён, возвращается 403 с кодом email_not_verified,
        токены не создаются и cookies не устанавливаются. Попытки ограничиваются:
        60 попыток за 15 минут с одного IP (считаются все попытки, включая успешные)
        и 10 неудачных за 15 минут для одного адреса (верный пароль или сброс пароля
        обнуляет счётчик адреса); при превышении - 429 с кодом rate_limited, одинаковый
        для существующих и неизвестных адресов.'
      parameters:
      - description: Учётные данные
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_transport_http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'code: email_not_verified'
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.errorResponse'
        "429":
          description: 'code: rate_limited'
          headers:
            Retry-After:
              description: Секунд до следующей попытки
              type: integer
          schema:
            $ref: '#/definitions/internal_modules_auth_transport_http.rateLimitedResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход пользователя
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Выход пользователя
      tags:
      - auth
  /auth/me:
