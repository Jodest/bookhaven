info:
  contact: {}
  description: Социальный каталог книг для рынка РФ и СНГ. REST API для веб- и админ-приложений
    BookHaven.
  title: BookHaven API
  version: "1.0"
paths:
  /admin/authors:
    get:
      description: Требуется роль admin
      parameters:
      - description: Поиск
        in: query
        name: search
        type: string
      - description: 'Статус: pending, published, rejected'
        in: query
        name: status
        type: string
      - description: Номер страницы
        in: query
        name: page
        type: integer
      - description: Размер страницы, максимум 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_admin_transport_http.listAuthorsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
