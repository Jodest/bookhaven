info:
  contact: {}
  description: Социальный каталог книг для рынка РФ и СНГ. REST API для веб- и админ-приложений
    BookHaven.
  title: BookHaven API
  version: "1.0"
paths:
  /admin/ai-collections/drafts:
    get:
      description: Требуется роль admin. 20 последних черновиков подборки collection_id,
        новые первыми. Черновик в статусе queued/running без прогресса больше часа
        показывается как failed с error_code timeout. Работает и при выключенной функции.
      parameters:
      - description: ID подборки (UUID)
        in: query
        name: collection_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aicollections_transport_http.listDraftsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Недавние черновики подборки от ИИ (админ)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 'Требуется роль admin и Bearer-токен. collection_id — ручная подборка,
        brief — описание подборки (1–500 символов после обрезки пробелов), count —
        сколько книг предложить (1–1000; по умолчанию размер подборки плюс пятая часть,
        не больше 1000). Черновик сохраняется в статусе queued и составляется воркером:
        модель предлагает книги, сопоставление с каталогом выполняется при чтении
        черновика. Подборка и каталог не меняются. 503 — функция выключена; 400 —
        неверные collection_id, brief или count; 404 — подборка не найдена; 422 —
        подборка автоматическая; 409 — у подборки уже составляется черновик (draft_id);
        429 — исчерпан дневной лимит (20 черновиков за 24 часа); 502 — не удалось
        поставить задачу в очередь (черновик помечается failed / enqueue_failed).'
      parameters:
      - description: collection_id, brief и необязательный count
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_aicollections_transport_http.createDraftRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_modules_aicollections_transport_http.draftSummaryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать черновик подборки от ИИ (админ)
      tags:
      - admin
  /admin/ai-collections/drafts/{id}:
    get:
      description: 'Требуется роль admin. Для готового черновика (done) поле report
        вычисляется при чтении по текущему каталогу и составу подборки: те же статусы,
        что у предпросмотра вставленного списка (found, ambiguous, not_found, rejected,
        in_collection, duplicate), по записи на каждое предложение в порядке рангов;
        line — ранг, original_title и note — мнение модели, только для показа как
        обычный текст. Для остальных статусов report равен null, а proposals_count
        показывает прогресс. Книга, которой нет в каталоге (not_found), не создаётся
        и не добавляется.'
      parameters:
      - description: ID черновика (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aicollections_transport_http.draftDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Черновик подборки от ИИ с отчётом по каталогу (админ)
      tags:
      - admin
  /admin/ai-collections/status:
    get:
      description: Требуется роль admin. enabled — включены ли черновики (флаг AI_COLLECTIONS_ENABLED
        и ключ API заданы), model — модель, prompt_version — версия промпта, лимиты
        (max_brief_length, max_count, daily_limit), used_today — число черновиков
        текущего администратора за последние 24 часа. Работает и при выключенной функции.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aicollections_transport_http.draftStatusResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Статус черновиков подборок от ИИ (админ)
      tags:
      - admin
  /admin/ai-curator/requests:
    get:
      description: Требуется роль admin. 20 последних запросов всех администраторов,
        новые первыми. Запрос в статусе queued/running без прогресса больше часа показывается
        как failed с error_code timeout. Работает и при выключенном подборе.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aicurator_transport_http.listCurationRequestsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Недавние запросы подбора авторов ИИ (админ)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 'Требуется роль admin и Bearer-токен. prompt — описание, каких
        авторов не хватает (1–500 символов после обрезки пробелов), max_names — сколько
        имён предложить (1–30, по умолчанию 20). Запрос сохраняется в статусе queued
        и обрабатывается воркером: модель предлагает только имена, каждое проверяется
        по Wikidata. Ничего не импортируется и не публикуется автоматически. 503 —
        подбор выключен; 400 — неверный prompt или max_names; 409 — у администратора
        уже есть активный запрос (request_id); 429 — исчерпан дневной лимит (20 запросов
        за 24 часа); 502 — не удалось поставить задачу в очередь (запрос помечается
        failed / enqueue_failed).'
      parameters:
      - description: prompt и необязательный max_names
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_aicurator_transport_http.createCurationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_modules_aicurator_transport_http.curationSummaryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать запрос на подбор авторов ИИ (админ)
      tags:
      - admin
  /admin/ai-curator/requests/{id}:
    get:
      description: 'Требуется роль admin. Кандидаты в порядке ответа модели; у каждого
        match_status (pending, matched, ambiguous, not_found, error) и options — люди
        из Wikidata с русской меткой (qid, label, description). Поле existing вычисляется
        при чтении: автор BookHaven с этим QID (id, name, slug, status) или null.
        Имя и note — мнение модели, только для показа как обычный текст. Ничего не
        выбирается автоматически.'
      parameters:
      - description: ID запроса (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aicurator_transport_http.curationDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Запрос подбора авторов ИИ с кандидатами (админ)
      tags:
      - admin
  /admin/ai-curator/status:
    get:
      description: Требуется роль admin. enabled — включён ли подбор (флаг AI_CURATOR_ENABLED
        и ключ API заданы), model — модель, prompt_version — версия промпта, лимиты
        (max_prompt_length, max_names, default_names, daily_limit), used_today — число
        запросов текущего администратора за последние 24 часа, active_request_id —
        его активный (в очереди или выполняется) запрос или null.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aicurator_transport_http.curationStatusResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Статус подбора авторов ИИ (админ)
      tags:
      - admin
  /admin/ai-descriptions:
    get:
      description: Требуется роль admin. status — draft (по умолчанию), approved,
        discarded, unknown или failed; новые первыми; limit 1–50 (по умолчанию 20).
        У каждой записи — книга (id, title, authors, published_year, status), статус,
        текст (показывать только как обычный текст), код ошибки, модель, время генерации,
        stale (с генерации изменились версия промпта или данные книги) и superseded
        (у книги появилось собственное описание). Работает и при выключенной генерации.
      parameters:
      - description: Статус (draft, approved, discarded, unknown, failed)
        in: query
        name: status
        type: string
      - description: Страница (с 1)
        in: query
        name: page
        type: integer
      - description: Размер страницы (1–50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aidescriptions_transport_http.listAIDescriptionsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Список описаний ИИ (админ)
      tags:
      - admin
  /admin/ai-descriptions/{book_id}:
    get:
      description: Требуется роль admin. Возвращает запись описания ИИ книги или null.
        Работает и при выключенной генерации.
      parameters:
      - description: ID книги (UUID)
        in: path
        name: book_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aidescriptions_transport_http.aiDescriptionDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Описание ИИ книги (админ)
      tags:
      - admin
  /admin/ai-descriptions/{book_id}/approve:
    post:
      consumes:
      - application/json
      description: 'Требуется роль admin и Bearer-токен. Одобряет черновик или уже
        одобренное описание. Необязательный text заменяет сгенерированный текст (1–2000
        символов после обрезки пробелов, в основном кириллица) и помечает описание
        изменённым. Описание книги не меняется: одобренное описание ИИ показывается
        на сайте с пометкой, пока у книги нет собственного описания. 404 — записи
        нет; 409 — запись не черновик и не одобрена, или у книги уже есть собственное
        описание; 422 — неверный текст. Работает и при выключенной генерации.'
      parameters:
      - description: ID книги (UUID)
        in: path
        name: book_id
        required: true
        type: string
      - description: Необязательный исправленный текст
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_modules_aidescriptions_transport_http.approveAIDescriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aidescriptions_transport_http.aiDescriptionItemResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Одобрить описание ИИ (админ)
      tags:
      - admin
  /admin/ai-descriptions/{book_id}/discard:
    post:
      description: Требуется роль admin и Bearer-токен. Переводит черновик или одобренное
        описание в отклонённые (одобренное снимается с сайта). 404 — записи нет; 409
        — запись не черновик и не одобрена. Работает и при выключенной генерации.
      parameters:
      - description: ID книги (UUID)
        in: path
        name: book_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_aidescriptions_transport_http.aiDescriptionItemResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Отклонить описание ИИ (админ)
      tags:
      - admin
  /admin/ai-descriptions/generate:
    post:
      consumes:
      - application/json
      description: 'Требуется роль admin и Bearer-токен. Ровно одна форма: {"book_ids":
        [...]} — 1–100 UUID (повторы убираются), каждая подходящая книга (без собственного
        описания, статус pending или published) генерируется заново, какой бы ни была
        её текущая запись; или {"all_missing": true} — до 200 опубликованных книг
        без собственного описания и без какой-либо записи описания ИИ, старые первыми.
        Генерация идёт только в фоновом воркере; результат — черновик, который одобряет
        администратор. В описание книги ничего не записывается. 503 — генерация выключена
        (проверяется первым); 400 — неверный запрос; 409 — генерация для книг без
        описания уже в очереди; 502 — не удалось поставить задачу в очередь.'
      parameters:
      - description: book_ids или all_missing
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_aidescriptions_transport_http.generateAIDescriptionsRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_modules_aidescriptions_transport_http.generateAIDescriptionsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
