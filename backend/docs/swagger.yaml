      processed:
        type: integer
      updated:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.BulkStatusRowError:
    properties:
      author_id:
        type: string
      message:
        type: string
      name:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.GenreBulkStatusReport:
    properties:
      errors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_admin_service.GenreBulkStatusRowError'
        type: array
      processed:
        type: integer
      updated:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.GenreBulkStatusRowError:
    properties:
      genre_id:
        type: string
      message:
        type: string
      name:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.ImportReport:
    properties:
      created:
        type: integer
      errors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_admin_service.ImportRowError'
        type: array
      processed:
        type: integer
      skipped_existing:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_admin_service.ImportRowError:
    properties:
      message:
        type: string
      row:
        type: integer
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_catalog_transport_http.AuthorResponse:
    properties:
      birth_date:
        type: string
      id:
        type: string
      name:
        type: string
      photo_url:
        type: string
      slug:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_catalog_transport_http.BookListItemResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_catalog_transport_http.AuthorResponse'
        type: array
      cover_url:
        type: string
      genres:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_catalog_transport_http.GenreResponse'
        type: array
      id:
        type: string
      published_year:
        type: integer
      rating:
        type: number
      ratings_count:
        type: integer
      slug:
        type: string
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_catalog_transport_http.GenreResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_harvest_service.HarvestRecordError:
    properties:
      index:
        type: integer
      message:
        type: string
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_harvest_service.HarvestResult:
    properties:
      author_enrichment_errors:
        type: integer
      authors_enriched:
        description: |-
          AuthorsEnriched / AuthorEnrichmentErrors report the end-of-job
          Wikidata enrichment of the authors this job created
          (docs/features/author-wikidata-enrichment.md rule 4b). Set only once
          that step ran (nil while the record loop is running, in results of
          older jobs, and when no enrichment source is configured).
        type: integer
      created:
        type: integer
      errors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_harvest_service.HarvestRecordError'
        type: array
      processed:
        type: integer
      skipped_existing:
        type: integer
      skipped_records:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_harvest_service.HarvestSkippedRecord'
        type: array
      total:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_harvest_service.HarvestSkippedRecord:
    properties:
      index:
        type: integer
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.adminUserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      name:
        type: string
      profile_type:
        type: string
      role:
        type: string
    type: object
  internal_modules_admin_transport_http.authorHintResponse:
    properties:
      author:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      match:
        description: Match is exact_name | surname_initial | surname.
        type: string
    type: object
  internal_modules_admin_transport_http.authorImportResponse:
    properties:
      author:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      enrichment:
        allOf:
        - $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_admin_service.AuthorEnrichmentSummary'
        description: |-
          Enrichment is the Wikidata enrichment applied to a created author
          (filled fields, notes, error); null unless outcome is created.
      match:
        description: Match is qid | slug for existing/rejected, null for created.
        type: string
      namesake_of:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      outcome:
        description: Outcome is created | existing | rejected.
        type: string
      qid_backfilled:
        type: boolean
    type: object
  internal_modules_admin_transport_http.authorQueueItemResponse:
    properties:
      author:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      books_total:
        type: integer
      books_visible:
        type: integer
      created_at:
        type: string
      sample_books:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.authorSampleBookResponse'
        type: array
      similar:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.authorHintResponse'
        type: array
    type: object
  internal_modules_admin_transport_http.authorResponse:
    properties:
      biography:
        type: string
      birth_date:
        type: string
      death_date:
        type: string
      external_id:
        type: string
      external_source:
        type: string
      id:
        type: string
      name:
        type: string
      photo_attribution:
        allOf:
        - $ref: '#/definitions/internal_modules_admin_transport_http.photoAttributionResponse'
        description: |-
          PhotoAttribution is the Wikimedia Commons attribution of a photo
          filled by Wikidata enrichment; null for manual photos.
      photo_url:
        type: string
      slug:
        type: string
      status:
        description: |-
          Status is pending | published | rejected (admin payloads always
          include it, embedded book authors too).
        type: string
    type: object
  internal_modules_admin_transport_http.authorSampleBookResponse:
    properties:
      id:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.bookResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
        type: array
      cover_url:
        type: string
      created_at:
        type: string
      description:
        type: string
      external_source:
        type: string
      genres:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
        type: array
      id:
        type: string
      isbn:
        type: string
      language:
        type: string
      page_count:
        type: integer
      published_year:
        type: integer
      rating:
        type: number
      ratings_count:
        type: integer
      reviews_count:
        type: integer
      slug:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_admin_transport_http.bulkAuthorStatusRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  internal_modules_admin_transport_http.bulkBookStatusRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  internal_modules_admin_transport_http.bulkGenreStatusRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  internal_modules_admin_transport_http.changeUserRoleRequest:
    properties:
      role:
        description: Role is one of user | contributor | moderator | admin.
        type: string
    type: object
  internal_modules_admin_transport_http.createUpdateAuthorRequest:
    properties:
      biography:
        type: string
      birth_date:
        type: string
      death_date:
        type: string
      name:
        type: string
      photo_url:
        type: string
      slug:
        type: string
      status:
        description: |-
          Status (pending | published | rejected) is applied on PATCH only;
          omitted = unchanged. Ignored on POST (new authors are published).
        type: string
    type: object
  internal_modules_admin_transport_http.createUpdateBookRequest:
    properties:
      allow_non_russian_title:
        description: |-
          AllowNonRussianTitle lifts only the Russian-title check for official
          Latin-script titles. Input-only, not persisted.
        type: boolean
      author_ids:
        items:
          type: string
        type: array
      cover_url:
        type: string
      description:
        type: string
      genre_ids:
        items:
          type: string
        type: array
      isbn:
        type: string
      language:
        type: string
      page_count:
        type: integer
      published_year:
        type: integer
      slug:
        type: string
      status:
        description: |-
          Status (pending | published | rejected): on POST omitted means
          published; on PATCH omitted means unchanged. Invalid -> 400.
        type: string
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.createUpdateGenreRequest:
    properties:
      name:
        type: string
      slug:
        type: string
      status:
        description: |-
          Status (pending | published | rejected) is applied on PATCH only;
          omitted = unchanged. Ignored on POST (new genres are published).
        type: string
      wikidata_qid:
        description: |-
          WikidataQID: omitted/null = unchanged, "" = clear, otherwise a bare
          QID (^Q[0-9]+$ after trim/uppercase; 400 invalid, 409 taken).
        type: string
    type: object
  internal_modules_admin_transport_http.dashboardResponse:
    properties:
      authors:
        type: integer
      books:
        type: integer
      genres:
        type: integer
      pending_authors:
        type: integer
      pending_books:
        type: integer
      pending_genres:
        type: integer
      pending_reviews:
        type: integer
      rejected_books:
        type: integer
    type: object
  internal_modules_admin_transport_http.enrichWikidataRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  internal_modules_admin_transport_http.genreAliasRefResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  internal_modules_admin_transport_http.genreExistingResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      status:
        type: string
      via_alias:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreAliasRefResponse'
    type: object
  internal_modules_admin_transport_http.genreHintResponse:
    properties:
      genre:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
      match:
        description: Match is exact_name | same_stem | shared_word.
        type: string
    type: object
  internal_modules_admin_transport_http.genreImportResponse:
    properties:
      genre:
        allOf:
        - $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
        description: Genre is the canonical genre.
      match:
        description: Match is qid | slug for existing/rejected, null for created.
        type: string
      outcome:
        description: Outcome is created | existing | rejected.
        type: string
      qid_backfilled:
        type: boolean
      qid_mismatch:
        description: |-
          QIDMismatch is the QID of a same-named genre that carries a
          different QID (left untouched), null otherwise.
        type: string
      via_alias:
        allOf:
        - $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
        description: |-
          ViaAlias is the merged genre the match was followed through, null
          for a direct match.
    type: object
  internal_modules_admin_transport_http.genreQueueItemResponse:
    properties:
      books_total:
        type: integer
      books_visible:
        type: integer
      created_at:
        type: string
      genre:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
      sample_books:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreSampleBookResponse'
        type: array
      similar:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreHintResponse'
        type: array
    type: object
  internal_modules_admin_transport_http.genreResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      status:
        description: Status is pending | published | rejected (docs/features/genre-status.md).
        type: string
      wikidata_qid:
        description: WikidataQID is the bare Wikidata QID, null when none.
        type: string
    type: object
  internal_modules_admin_transport_http.genreSampleBookResponse:
    properties:
      id:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.genreWikidataCandidateResponse:
    properties:
      description:
        type: string
      existing:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreExistingResponse'
      label:
        type: string
      literary_genre:
        description: |-
          LiteraryGenre is true for checked candidates, null when class_check
          is unavailable.
        type: boolean
      qid:
        type: string
      ru_label:
        description: |-
          RuLabel is the Russian label; null when absent or when class_check
          is unavailable.
        type: string
    type: object
  internal_modules_admin_transport_http.genreWikidataSearchResponse:
    properties:
      class_check:
        description: ClassCheck is ok | unavailable.
        type: string
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreWikidataCandidateResponse'
        type: array
    type: object
  internal_modules_admin_transport_http.importWikidataAuthorRequest:
    properties:
      qid:
        example: Q7200
        type: string
    type: object
  internal_modules_admin_transport_http.importWikidataGenreRequest:
    properties:
      qid:
        example: Q132311
        type: string
    type: object
  internal_modules_admin_transport_http.listAuthorQueueResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.authorQueueItemResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  internal_modules_admin_transport_http.listAuthorsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  internal_modules_admin_transport_http.listBooksResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.bookResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  internal_modules_admin_transport_http.listGenreQueueResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreQueueItemResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  internal_modules_admin_transport_http.listGenresResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  internal_modules_admin_transport_http.listReviewsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.reviewResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  internal_modules_admin_transport_http.listUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.adminUserResponse'
