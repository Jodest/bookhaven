  /admin/authors/sync-screen-works:
    post:
      consumes:
      - application/json
      description: 'Требуется роль admin и Bearer-токен. Для 1..50 авторов (любой
        статус, дубликаты схлопываются) с QID Wikidata находит видеоработы, у которых
        главная тема (P921) - автор: фильмы, телефильмы, сериалы, мультфильмы, мультсериалы,
        телеспектакли, документальные и биографические фильмы; серии фильмов, игры,
        статьи-списки и эпизоды отбрасываются. Документальные получают relation =
        documentary, остальные - biopic. Связи публикуются сразу, синхронизация только
