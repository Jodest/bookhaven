        items:
          type: string
        type: array
      cover_url:
        type: string
      description:
        type: string
      genres:
        items:
          type: string
        type: array
      isbn:
        type: string
      language:
        type: string
      page_count:
        type: integer
      published_year:
        type: integer
      source_id:
        type: string
      source_name:
        type: string
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.mergeAuthorsRequest:
    properties:
      canonical_id:
        type: string
    type: object
  internal_modules_admin_transport_http.mergeAuthorsResponse:
    properties:
      author:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      books_reassigned:
        type: integer
