      description: 'Дефолтные полки: «Хочу прочитать», «Читаю», «Прочитано», «Брошено»
        (создаются лениво). С book_id в ответ добавляется reads — сводка чтений этой
        книги вызывающим: reads_count (завершённые чтения), last_read_at, rereading
        (есть открытое чтение и хотя бы одно завершённое)'
      parameters:
      - description: Если указан, для каждой полки помечается наличие книги
        in: query
        name: book_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_shelves_transport_http.listShelvesResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Список полок пользователя
      tags:
      - shelves
    post:
      consumes:
      - application/json
      parameters:
      - description: Название, описание и приватность полки
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_shelves_transport_http.createShelfRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_shelves_transport_http.shelfResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать полку
      tags:
      - shelves
  /shelves/{id}:
    delete:
      parameters:
      - description: ID полки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить полку
      tags:
      - shelves
    get:
      description: Каждая книга несёт reads_count и last_read_at — завершённые чтения
        владельца полки
      parameters:
      - description: ID полки
        in: path
        name: id
        required: true
        type: string
      - description: Номер страницы
        in: query
        name: page
        type: integer
      - description: Размер страницы, максимум 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_shelves_transport_http.shelfDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить полку с книгами
      tags:
      - shelves
    patch:
      consumes:
      - application/json
      description: 'Частичное обновление: название, описание, приватность. Дефолтные
        полки изменить нельзя (400)'
      parameters:
      - description: ID полки
        in: path
        name: id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_shelves_transport_http.updateShelfRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_shelves_transport_http.shelfResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Изменить полку
      tags:
      - shelves
  /shelves/{id}/books:
    post:
      consumes:
      - application/json
      description: 'Дефолтные полки эксклюзивны: книга снимается с остальных. Журнал
        чтений обновляется в той же транзакции: «Читаю» открывает чтение (повторное
        нажатие после «Прочитано» — перечитывание, прежние чтения сохраняются), «Прочитано»
        закрывает открытое чтение как завершённое, «Брошено» — как брошенное, «Хочу
        прочитать» удаляет открытое'
      parameters:
      - description: ID полки
        in: path
        name: id
        required: true
        type: string
      - description: ID книги
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_shelves_transport_http.addBookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Добавить книгу на полку
      tags:
      - shelves
  /shelves/{id}/books/{bookId}:
    delete:
      description: 'Снятие с «Прочитано» — отмена: удаляется только чтение, которое
        записал этот статус (не правленное вручную), остальная история остаётся. Снятие
        с «Читаю» удаляет открытое чтение'
      parameters:
      - description: ID полки
        in: path
        name: id
        required: true
        type: string
      - description: ID книги
        in: path
        name: bookId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Убрать книгу с полки
      tags:
      - shelves
  /shelves/public/{id}:
    get:
      description: Доступно без авторизации. Приватная полка возвращает 404 (в том
        числе владельцу); владелец управляет ею через GET /shelves/{id}. reads_count
        и last_read_at считаются для владельца полки, не для вызывающего
      parameters:
      - description: ID полки
        in: path
        name: id
        required: true
        type: string
      - description: Номер страницы
        in: query
        name: page
        type: integer
      - description: Размер страницы, максимум 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_shelves_transport_http.shelfDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить публичную полку с книгами
      tags:
      - shelves
  /users/{id}:
    get:
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_users_transport_http.publicProfileResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Публичный профиль пользователя
      tags:
      - users
  /users/me:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Поля для обновления
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_users_transport_http.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_users_transport_http.ownerUserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновить свой профиль
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Введите access-токен в формате: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
