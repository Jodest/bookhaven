  /admin/genres/import-wikidata:
    post:
      consumes:
      - application/json
      description: 'Требуется роль admin и Bearer-токен. Сначала ищет жанр в БД по
        QID с учётом слитых жанров (без запроса к Wikidata), затем загружает элемент
        Wikidata (нужно русское название), проверяет, что это литературный жанр, и
        сопоставляет по правилам харвеста: совпадение по slug без QID — QID привязывается;
        с другим QID — существующий жанр не меняется (qid_mismatch); слитый жанр —
        возвращается каноничный (via_alias); иначе создаётся жанр в статусе pending
        с QID. Отклонённые жанры повторно не создаются (outcome=rejected). Название,
        slug и статус существующего жанра не меняются. 201 — создан, 200 — existing
        / rejected. 422 содержит code: no_ru_label | not_a_literary_genre.'
      parameters:
      - description: QID элемента Wikidata
        in: body
        name: body
        required: true
