        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_curated_transport_http.PasteCountsResponse:
    properties:
      ambiguous:
        type: integer
      duplicate:
        type: integer
      found:
        type: integer
      in_collection:
        type: integer
      invalid:
        type: integer
      not_found:
        type: integer
      rejected:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_curated_transport_http.adminAuthorResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_curated_transport_http.pasteBookResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_curated_transport_http.adminAuthorResponse'
        type: array
      cover_url:
        type: string
      id:
        type: string
      in_collection:
        type: boolean
      published_year:
        type: integer
      slug:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_harvest_service.HarvestRecordError:
    properties:
      index:
        type: integer
      message:
        type: string
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_harvest_service.HarvestResult:
    properties:
      adaptation_sync_errors:
        type: integer
      adaptations_added:
        description: |-
          AdaptationsAdded / AdaptationSyncErrors report the end-of-job sync of
          screen adaptations of the books this job created (openspec
          catalog-import/wikidata-book-harvest). Set only once that step ran
          (nil without a configured syncer and in results of older jobs).
        type: integer
      author_enrichment_errors:
        type: integer
      author_film_sync_errors:
        type: integer
      author_films_added:
        description: |-
          AuthorFilmsAdded / AuthorFilmSyncErrors report the end-of-job sync of
          films about the authors this job created (openspec
          catalog-import/wikidata-book-harvest). Set only once that step ran
          (nil without a configured syncer and in results of older jobs).
        type: integer
      authors_enriched:
        description: |-
          AuthorsEnriched / AuthorEnrichmentErrors report the end-of-job
          Wikidata enrichment of the authors this job created
          (docs/features/author-wikidata-enrichment.md rule 4b). Set only once
          that step ran (nil while the record loop is running, in results of
          older jobs, and when no enrichment source is configured).
        type: integer
      created:
        type: integer
      errors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_harvest_service.HarvestRecordError'
        type: array
      processed:
        type: integer
      skipped_existing:
        type: integer
      skipped_records:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_harvest_service.HarvestSkippedRecord'
        type: array
      total:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_harvest_service.HarvestSkippedRecord:
    properties:
      index:
        type: integer
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_screenworks_domain.WorkFields:
    properties:
      director:
        type: string
      imdb_id:
        type: string
      kind:
        type: string
      kinopoisk_id:
        type: string
      original_title:
        type: string
      qid:
        type: string
      title:
        type: string
      year:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_screenworks_service.AuthorSyncItem:
    properties:
      added:
        type: integer
      author_id:
        type: string
      found:
        type: integer
      message:
        type: string
      name:
        type: string
      notes:
        items:
          type: string
        type: array
      outcome:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_screenworks_service.AuthorSyncReport:
    properties:
      added:
        type: integer
      items:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_screenworks_service.AuthorSyncItem'
        type: array
      processed:
        type: integer
      updated:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_screenworks_service.CatalogSyncError:
    properties:
      book_id:
        type: string
      reason:
        type: string
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_screenworks_service.CatalogSyncResult:
    properties:
      added:
        type: integer
      errors:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_screenworks_service.CatalogSyncError'
        type: array
      failed:
        type: integer
      posters:
        type: integer
      processed:
        type: integer
      skipped:
        type: integer
      total:
        type: integer
      unchanged:
        type: integer
      updated:
        type: integer
    type: object
  github_com_bookhaven_backend_internal_modules_screenworks_service.SyncItem:
    properties:
      added:
        type: integer
      book_id:
        type: string
      found:
        type: integer
      message:
        type: string
      notes:
        items:
          type: string
        type: array
      outcome:
        type: string
      posters:
        type: integer
      title:
        type: string
    type: object
  github_com_bookhaven_backend_internal_modules_screenworks_service.SyncReport:
    properties:
      added:
        type: integer
      items:
        items:
          $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_screenworks_service.SyncItem'
        type: array
      posters:
        type: integer
      processed:
        type: integer
      updated:
        type: integer
    type: object
  internal_modules_admin_transport_http.adminUserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: string
      name:
        type: string
      profile_type:
        type: string
      role:
        type: string
    type: object
  internal_modules_admin_transport_http.authorHintResponse:
    properties:
      author:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      match:
        description: Match is exact_name | surname_initial | surname.
        type: string
    type: object
  internal_modules_admin_transport_http.authorImportResponse:
    properties:
      author:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      enrichment:
        allOf:
        - $ref: '#/definitions/github_com_bookhaven_backend_internal_modules_admin_service.AuthorEnrichmentSummary'
        description: |-
          Enrichment is the Wikidata enrichment applied to a created author
          (filled fields, notes, error); null unless outcome is created.
      match:
        description: Match is qid | slug for existing/rejected, null for created.
        type: string
      namesake_of:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      outcome:
        description: Outcome is created | existing | rejected.
        type: string
      qid_backfilled:
        type: boolean
    type: object
  internal_modules_admin_transport_http.authorQueueItemResponse:
    properties:
      author:
        $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
      books_total:
        type: integer
      books_visible:
        type: integer
      created_at:
        type: string
      sample_books:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.authorSampleBookResponse'
        type: array
      similar:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.authorHintResponse'
        type: array
    type: object
  internal_modules_admin_transport_http.authorResponse:
    properties:
      auto_harvest:
        description: AutoHarvest is the scheduled-harvest opt-in.
        type: boolean
      biography:
        type: string
      birth_date:
        type: string
      death_date:
        type: string
      external_id:
        type: string
      external_source:
        type: string
      id:
        type: string
      last_auto_harvested_at:
        description: |-
          LastAutoHarvestedAt (RFC 3339, read-only) is when the worker last
          queued a scheduled harvest covering the author; null if never.
        type: string
      name:
        type: string
      photo_attribution:
        allOf:
        - $ref: '#/definitions/internal_modules_admin_transport_http.photoAttributionResponse'
        description: |-
          PhotoAttribution is the Wikimedia Commons attribution of a photo
          filled by Wikidata enrichment; null for manual photos.
      photo_url:
        type: string
      slug:
        type: string
      status:
        description: |-
          Status is pending | published | rejected (admin payloads always
          include it, embedded book authors too).
        type: string
    type: object
  internal_modules_admin_transport_http.authorSampleBookResponse:
    properties:
      id:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.bookAIVerdictResponse:
    properties:
      confidence:
        type: number
      created_at:
        type: string
      model:
        type: string
      prompt_version:
        type: integer
      reason:
        type: string
      reason_codes:
        items:
          type: string
        type: array
      stale:
        description: |-
          Stale is true when the prompt version or the book's data changed
          since the verdict was computed.
        type: boolean
      verdict:
        description: Verdict is publish | reject | needs_human.
        type: string
    type: object
  internal_modules_admin_transport_http.bookHintBookResponse:
    properties:
      external_source:
        type: string
      id:
        type: string
      isbn:
        type: string
      published_year:
        type: integer
      slug:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.bookHintResponse:
    properties:
      book:
        $ref: '#/definitions/internal_modules_admin_transport_http.bookHintBookResponse'
      match:
        description: Match is same_isbn | same_title_author.
        type: string
    type: object
  internal_modules_admin_transport_http.bookQueueItemResponse:
    properties:
      ai_verdict:
        allOf:
        - $ref: '#/definitions/internal_modules_admin_transport_http.bookAIVerdictResponse'
        description: AIVerdict is null when the book has no AI verdict.
      book:
        $ref: '#/definitions/internal_modules_admin_transport_http.bookResponse'
      created_at:
        type: string
      external_id:
        type: string
      similar:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.bookHintResponse'
        type: array
    type: object
  internal_modules_admin_transport_http.bookResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.authorResponse'
        type: array
      cover_copy:
        allOf:
        - $ref: '#/definitions/internal_modules_admin_transport_http.coverCopyResponse'
        description: |-
          CoverCopy describes the self-hosted copy of cover_url (the source link is
          always returned in cover_url, never our /covers path); null without a link.
      cover_url:
        type: string
      created_at:
        type: string
      description:
        type: string
      external_id:
        type: string
      external_source:
        type: string
      genres:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
        type: array
      id:
        type: string
      isbn:
        type: string
      language:
        type: string
      page_count:
        type: integer
      published_at:
        type: string
      published_year:
        type: integer
      rating:
        type: number
      ratings_count:
        type: integer
      reviews_count:
        type: integer
      slug:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_admin_transport_http.bulkAuthorStatusRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  internal_modules_admin_transport_http.bulkBookStatusRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  internal_modules_admin_transport_http.bulkGenreStatusRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  internal_modules_admin_transport_http.changeUserRoleRequest:
    properties:
      role:
        description: Role is one of user | contributor | moderator | admin.
        type: string
    type: object
  internal_modules_admin_transport_http.coverCopyResponse:
    properties:
      error:
        type: string
      status:
        enum:
        - pending
        - stored
        - failed
        - absent
        - linked
        type: string
      stored_at:
        type: string
    type: object
  internal_modules_admin_transport_http.createUpdateAuthorRequest:
    properties:
      auto_harvest:
        description: |-
          AutoHarvest opts the author into the scheduled Wikidata harvest; it
          is applied on PATCH only (omitted = unchanged) and needs a Wikidata
          QID when true (422 otherwise). Ignored on POST.
        type: boolean
      biography:
        type: string
      birth_date:
        type: string
      death_date:
        type: string
      name:
        type: string
      photo_url:
        type: string
      slug:
        type: string
      status:
        description: |-
          Status (pending | published | rejected) is applied on PATCH only;
          omitted = unchanged. Ignored on POST (new authors are published).
        type: string
    type: object
  internal_modules_admin_transport_http.createUpdateBookRequest:
    properties:
      allow_non_russian_title:
        description: |-
          AllowNonRussianTitle lifts only the Russian-title check for official
          Latin-script titles. Input-only, not persisted.
        type: boolean
      author_ids:
        items:
          type: string
        type: array
      cover_url:
        type: string
      description:
        type: string
      genre_ids:
        items:
          type: string
        type: array
      isbn:
        type: string
      language:
        type: string
      page_count:
        type: integer
      published_year:
        type: integer
      slug:
        type: string
      status:
        description: |-
          Status (pending | published | rejected): on POST omitted means
          published; on PATCH omitted means unchanged. Invalid -> 400.
        type: string
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.createUpdateGenreRequest:
    properties:
      name:
        type: string
      slug:
        type: string
      status:
        description: |-
          Status (pending | published | rejected) is applied on PATCH only;
          omitted = unchanged. Ignored on POST (new genres are published).
        type: string
      wikidata_qid:
        description: |-
          WikidataQID: omitted/null = unchanged, "" = clear, otherwise a bare
          QID (^Q[0-9]+$ after trim/uppercase; 400 invalid, 409 taken).
        type: string
    type: object
  internal_modules_admin_transport_http.dashboardResponse:
    properties:
      authors:
        type: integer
      books:
        type: integer
      genres:
        type: integer
      pending_authors:
        type: integer
      pending_books:
        type: integer
      pending_genres:
        type: integer
      pending_reviews:
        type: integer
      rejected_books:
        type: integer
    type: object
  internal_modules_admin_transport_http.enrichWikidataRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  internal_modules_admin_transport_http.genreAliasRefResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  internal_modules_admin_transport_http.genreExistingResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      status:
        type: string
      via_alias:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreAliasRefResponse'
    type: object
  internal_modules_admin_transport_http.genreHintResponse:
    properties:
      genre:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
      match:
        description: Match is exact_name | same_stem | shared_word.
        type: string
    type: object
  internal_modules_admin_transport_http.genreImportResponse:
    properties:
      genre:
        allOf:
        - $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
        description: Genre is the canonical genre.
      match:
        description: Match is qid | slug for existing/rejected, null for created.
        type: string
      outcome:
        description: Outcome is created | existing | rejected.
        type: string
      qid_backfilled:
        type: boolean
      qid_mismatch:
        description: |-
          QIDMismatch is the QID of a same-named genre that carries a
          different QID (left untouched), null otherwise.
        type: string
      via_alias:
        allOf:
        - $ref: '#/definitions/internal_modules_admin_transport_http.genreResponse'
        description: |-
          ViaAlias is the merged genre the match was followed through, null
          for a direct match.
    type: object
  internal_modules_admin_transport_http.genreMergeCollection:
    properties:
      id:
        type: string
      is_published:
        type: boolean
      kind:
        type: string
      slug:
        type: string
      source_genre:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreMergeCollectionSource'
      title:
        type: string
    type: object
  internal_modules_admin_transport_http.genreMergeCollectionSource:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  internal_modules_admin_transport_http.genreMergeEntryResponse:
    properties:
      books_reassigned:
        type: integer
      collections_switched:
        type: integer
      created_at:
        type: string
      id:
        type: string
      performed_by:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreMergeUserRef'
      sources:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreMergeGenreRef'
        type: array
      target:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreMergeGenreRef'
      undone_at:
        type: string
      undone_by:
        $ref: '#/definitions/internal_modules_admin_transport_http.genreMergeUserRef'
    type: object
  internal_modules_admin_transport_http.genreMergeGenreRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  internal_modules_admin_transport_http.genreMergeListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_modules_admin_transport_http.genreMergeEntryResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  internal_modules_admin_transport_http.genreMergeUndoBlockedResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  internal_modules_admin_transport_http.genreMergeUndoPreviewResponse:
    properties:
      books_relinked:
        type: integer
      books_returned:
        type: integer
      collections:
