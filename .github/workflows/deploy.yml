name: Deploy

# Manual-only until a production server exists (issue #523): every push to main
# used to re-run CI, build/push 3 images and then fail at `deploy` (no host).
# To re-enable deploy-on-push, see docs/DEPLOYMENT.md -> "Ongoing deploys".
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # ci.yml's precheck job requests these; a called workflow can't exceed the caller's grant.
    permissions:
      contents: read
      actions: read
      pull-requests: read

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: owner
        # GHCR image names must be lowercase; github.repository_owner preserves the account's display case.
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/bookhaven-backend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/bookhaven-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.node
          target: web-production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/bookhaven-web:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/bookhaven-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.node
          target: admin-production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/bookhaven-admin:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/bookhaven-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/bookhaven
            export IMAGE_TAG=${{ needs.build-and-push.outputs.tag }}
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm --entrypoint /app/migrate backend up
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            sleep 5
            set -a; source .env; set +a
            curl -fsS "https://${API_DOMAIN}/health" || (docker compose -f docker-compose.prod.yml logs --tail=100 backend caddy && exit 1)
