# Log rotation for every service (docs/DEPLOYMENT.md "Resource limits and
# logs"): without max-size the json-file logs grow until the disk is full.
# Worst case on disk: services x LOG_MAX_SIZE x LOG_MAX_FILE.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-5}

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookhaven-postgres
    restart: unless-stopped
    logging: *default-logging
    # Memory caps sized for the 4 GB VPS (docs/DEPLOYMENT.md "Resource limits
    # and logs"); override any of them in .env.
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: bookhaven-redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    # AOF on top of the default RDB snapshots: queued asynq tasks survive a
    # crash with at most ~1 s of writes lost. Files land in the redis-data
    # volume (/data/appendonlydir). Turning AOF on over an existing RDB-only
    # volume needs the one-time step in docs/DEPLOYMENT.md, otherwise Redis
    # starts empty.
    command: ["redis-server", "--dir", "/data", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: bookhaven-backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    # Liveness (/health), not readiness: a PostgreSQL/Redis blip must not
    # turn the api unhealthy (same reason as Caddy's health_uri). The image
    # is distroless, so the probe is the static /app/healthcheck binary.
    healthcheck:
      test: ["CMD", "/app/healthcheck", "api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    environment:
      APP_ENV: production
      # Error tracking (docs/DEPLOYMENT.md): empty = off.
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Public web origin for links in emails (e.g. /verify-email).
      WEB_BASE_URL: https://${WEB_DOMAIN}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # AI pre-moderation (off by default; the api only reports status and
      # queues checks, it never calls the model). Needs the same flag and key
      # as the worker, otherwise the UI hides the «Проверить ИИ» buttons.
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-claude-haiku-5-5}
      AI_MODERATION_CRON: ${AI_MODERATION_CRON:-*/30 * * * *}
      AI_MODERATION_BATCH: ${AI_MODERATION_BATCH:-50}
      # AI curator of author import lists (off by default; shares
      # ANTHROPIC_API_KEY). The api stores requests and queues them; it needs
      # the same flag as the worker, otherwise requests end as timeout.
      AI_CURATOR_ENABLED: ${AI_CURATOR_ENABLED:-false}
      AI_CURATOR_MODEL: ${AI_CURATOR_MODEL:-claude-haiku-5-5}
      AI_DESCRIPTIONS_ENABLED: ${AI_DESCRIPTIONS_ENABLED:-false}
      AI_DESCRIPTIONS_MODEL: ${AI_DESCRIPTIONS_MODEL:-claude-sonnet-5-5}
      AI_COLLECTIONS_ENABLED: ${AI_COLLECTIONS_ENABLED:-false}
      AI_COLLECTIONS_MODEL: ${AI_COLLECTIONS_MODEL:-claude-sonnet-5-5}
      AI_GENRES_ENABLED: ${AI_GENRES_ENABLED:-false}
      AI_GENRES_MODEL: ${AI_GENRES_MODEL:-claude-sonnet-5-5}
      AI_GENRES_CRON: ${AI_GENRES_CRON-0 3 * * 1}
      AI_GENRES_BATCH: ${AI_GENRES_BATCH:-300}
      # Self-hosted covers: the api only serves files from the volume the
      # worker writes (mounted read-only); it queues copies after saves.
      COVERS_DIR: /data/covers
      COVERS_MIRROR_ENABLED: ${COVERS_MIRROR_ENABLED:-true}
    volumes:
      - covers-data:/data/covers:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: bookhaven-worker
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    entrypoint: ["/app/worker"]
    # No HTTP port: the probe passes while at least one asynq server of this
    # container heartbeats to Redis (so it also fails while Redis is down;
    # nothing depends on the worker's health and Docker never restarts an
    # unhealthy container, so this is a signal only).
    healthcheck:
      test: ["CMD", "/app/healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    environment:
      APP_ENV: production
      # Error tracking (docs/DEPLOYMENT.md): empty = off.
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Not used by the worker itself, but config.Load requires it in production.
      WEB_BASE_URL: https://${WEB_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Scheduled harvest of flagged authors (off by default). Run exactly
      # one worker replica: the scheduler lives in the worker.
      HARVEST_SCHEDULE_ENABLED: ${HARVEST_SCHEDULE_ENABLED:-false}
      HARVEST_SCHEDULE_CRON: ${HARVEST_SCHEDULE_CRON:-0 4 * * *}
      HARVEST_SCHEDULE_BATCH: ${HARVEST_SCHEDULE_BATCH:-10}
      ADAPTATION_SYNC_SCHEDULE_ENABLED: ${ADAPTATION_SYNC_SCHEDULE_ENABLED:-false}
      ADAPTATION_SYNC_SCHEDULE_CRON: ${ADAPTATION_SYNC_SCHEDULE_CRON:-0 5 * * 0}
      AUTO_COLLECTIONS_SCHEDULE_ENABLED: ${AUTO_COLLECTIONS_SCHEDULE_ENABLED:-true}
      AUTO_COLLECTIONS_SCHEDULE_CRON: ${AUTO_COLLECTIONS_SCHEDULE_CRON:-0 1 * * *}
      # AI pre-moderation of pending books (off by default; also needs
      # ANTHROPIC_API_KEY). The worker runs the sweep and the model calls.
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-claude-haiku-5-5}
      AI_MODERATION_CRON: ${AI_MODERATION_CRON:-*/30 * * * *}
      AI_MODERATION_BATCH: ${AI_MODERATION_BATCH:-50}
      # AI curator of author import lists (off by default; shares
      # ANTHROPIC_API_KEY). The worker makes the model and Wikidata calls.
      AI_CURATOR_ENABLED: ${AI_CURATOR_ENABLED:-false}
      AI_CURATOR_MODEL: ${AI_CURATOR_MODEL:-claude-haiku-5-5}
      AI_DESCRIPTIONS_ENABLED: ${AI_DESCRIPTIONS_ENABLED:-false}
      AI_DESCRIPTIONS_MODEL: ${AI_DESCRIPTIONS_MODEL:-claude-sonnet-5-5}
      AI_COLLECTIONS_ENABLED: ${AI_COLLECTIONS_ENABLED:-false}
      AI_COLLECTIONS_MODEL: ${AI_COLLECTIONS_MODEL:-claude-sonnet-5-5}
      AI_GENRES_ENABLED: ${AI_GENRES_ENABLED:-false}
      AI_GENRES_MODEL: ${AI_GENRES_MODEL:-claude-sonnet-5-5}
      AI_GENRES_CRON: ${AI_GENRES_CRON-0 3 * * 1}
      AI_GENRES_BATCH: ${AI_GENRES_BATCH:-300}
      # Self-hosted covers: the worker downloads and stores the copies
      # (volume mounted read-write) and runs the periodic sweep.
      COVERS_DIR: /data/covers
      COVERS_MIRROR_ENABLED: ${COVERS_MIRROR_ENABLED:-true}
      COVERS_SWEEP_CRON: ${COVERS_SWEEP_CRON-*/15 * * * *}
      COVERS_SWEEP_BATCH: ${COVERS_SWEEP_BATCH:-50}
      COVERS_ALLOWED_HOSTS: ${COVERS_ALLOWED_HOSTS:-covers.openlibrary.org,archive.org,*.archive.org,upload.wikimedia.org}
    volumes:
      - covers-data:/data/covers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    image: ${WEB_IMAGE}:${IMAGE_TAG:-latest}
    container_name: bookhaven-web
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    # Next standalone listens on $HOSTNAME (the container IP, not 127.0.0.1).
    # /favicon.ico is static and skips the middleware and the API, so a
    # backend outage does not make web unhealthy.
    healthcheck: &next-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://'+(process.env.HOSTNAME||'127.0.0.1')+':3000/favicon.ico',{redirect:'manual',signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      API_URL: http://backend:8080
      # Error tracking (docs/DEPLOYMENT.md): runtime-only, never NEXT_PUBLIC_*; empty = off.
      SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
      # Public origin of the site: makes self-hosted covers (/covers/...)
      # absolute in Open Graph and structured data.
      SITE_URL: https://${WEB_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  admin:
    image: ${ADMIN_IMAGE}:${IMAGE_TAG:-latest}
    container_name: bookhaven-admin
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${ADMIN_MEM_LIMIT:-384m}
    healthcheck: *next-healthcheck
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      API_URL: http://backend:8080
      # Error tracking (docs/DEPLOYMENT.md): runtime-only, never NEXT_PUBLIC_*; empty = off.
      SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: bookhaven-caddy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    # Caddy's admin API (127.0.0.1:2019 inside the container only) answers
    # once the config is loaded. TLS/ACME is not covered: the deploy's
    # external /health/ready check is.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # service_started on purpose: Caddy must come up (ACME, TLS, 502 pages)
    # even if an app is unhealthy; it probes the backend itself (health_uri).
    depends_on:
      - web
      - admin
      - backend
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  covers-data:
