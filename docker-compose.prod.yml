services:
  postgres:
    image: postgres:16-alpine
    container_name: bookhaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: bookhaven-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: bookhaven-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Public web origin for links in emails (e.g. /verify-email).
      WEB_BASE_URL: https://${WEB_DOMAIN}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # AI pre-moderation (off by default; the api only reports status and
      # queues checks, it never calls the model). Needs the same flag and key
      # as the worker, otherwise the UI hides the «Проверить ИИ» buttons.
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-claude-haiku-5-5}
      AI_MODERATION_CRON: ${AI_MODERATION_CRON:-*/30 * * * *}
      AI_MODERATION_BATCH: ${AI_MODERATION_BATCH:-50}
      # AI curator of author import lists (off by default; shares
      # ANTHROPIC_API_KEY). The api stores requests and queues them; it needs
      # the same flag as the worker, otherwise requests end as timeout.
      AI_CURATOR_ENABLED: ${AI_CURATOR_ENABLED:-false}
      AI_CURATOR_MODEL: ${AI_CURATOR_MODEL:-claude-haiku-5-5}
      AI_DESCRIPTIONS_ENABLED: ${AI_DESCRIPTIONS_ENABLED:-false}
      AI_DESCRIPTIONS_MODEL: ${AI_DESCRIPTIONS_MODEL:-claude-sonnet-5-5}
      AI_COLLECTIONS_ENABLED: ${AI_COLLECTIONS_ENABLED:-false}
      AI_COLLECTIONS_MODEL: ${AI_COLLECTIONS_MODEL:-claude-sonnet-5-5}
      AI_GENRES_ENABLED: ${AI_GENRES_ENABLED:-false}
      AI_GENRES_MODEL: ${AI_GENRES_MODEL:-claude-sonnet-5-5}
      AI_GENRES_CRON: ${AI_GENRES_CRON-0 3 * * 1}
      AI_GENRES_BATCH: ${AI_GENRES_BATCH:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    container_name: bookhaven-worker
    restart: unless-stopped
    entrypoint: ["/app/worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Not used by the worker itself, but config.Load requires it in production.
      WEB_BASE_URL: https://${WEB_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Scheduled harvest of flagged authors (off by default). Run exactly
      # one worker replica: the scheduler lives in the worker.
      HARVEST_SCHEDULE_ENABLED: ${HARVEST_SCHEDULE_ENABLED:-false}
      HARVEST_SCHEDULE_CRON: ${HARVEST_SCHEDULE_CRON:-0 4 * * *}
      HARVEST_SCHEDULE_BATCH: ${HARVEST_SCHEDULE_BATCH:-10}
      ADAPTATION_SYNC_SCHEDULE_ENABLED: ${ADAPTATION_SYNC_SCHEDULE_ENABLED:-false}
      ADAPTATION_SYNC_SCHEDULE_CRON: ${ADAPTATION_SYNC_SCHEDULE_CRON:-0 5 * * 0}
      AUTO_COLLECTIONS_SCHEDULE_ENABLED: ${AUTO_COLLECTIONS_SCHEDULE_ENABLED:-true}
      AUTO_COLLECTIONS_SCHEDULE_CRON: ${AUTO_COLLECTIONS_SCHEDULE_CRON:-0 1 * * *}
      # AI pre-moderation of pending books (off by default; also needs
      # ANTHROPIC_API_KEY). The worker runs the sweep and the model calls.
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-claude-haiku-5-5}
      AI_MODERATION_CRON: ${AI_MODERATION_CRON:-*/30 * * * *}
      AI_MODERATION_BATCH: ${AI_MODERATION_BATCH:-50}
      # AI curator of author import lists (off by default; shares
      # ANTHROPIC_API_KEY). The worker makes the model and Wikidata calls.
      AI_CURATOR_ENABLED: ${AI_CURATOR_ENABLED:-false}
      AI_CURATOR_MODEL: ${AI_CURATOR_MODEL:-claude-haiku-5-5}
      AI_DESCRIPTIONS_ENABLED: ${AI_DESCRIPTIONS_ENABLED:-false}
      AI_DESCRIPTIONS_MODEL: ${AI_DESCRIPTIONS_MODEL:-claude-sonnet-5-5}
      AI_COLLECTIONS_ENABLED: ${AI_COLLECTIONS_ENABLED:-false}
      AI_COLLECTIONS_MODEL: ${AI_COLLECTIONS_MODEL:-claude-sonnet-5-5}
      AI_GENRES_ENABLED: ${AI_GENRES_ENABLED:-false}
      AI_GENRES_MODEL: ${AI_GENRES_MODEL:-claude-sonnet-5-5}
      AI_GENRES_CRON: ${AI_GENRES_CRON-0 3 * * 1}
      AI_GENRES_BATCH: ${AI_GENRES_BATCH:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    image: ${WEB_IMAGE}:${IMAGE_TAG:-latest}
    container_name: bookhaven-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      API_URL: http://backend:8080
    depends_on:
      - backend
    networks: [internal]

  admin:
    image: ${ADMIN_IMAGE}:${IMAGE_TAG:-latest}
    container_name: bookhaven-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      API_URL: http://backend:8080
    depends_on:
      - backend
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: bookhaven-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - admin
      - backend
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
