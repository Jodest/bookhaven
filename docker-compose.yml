# Shared by the `web` and `admin` dev services. Both bind-mount the whole
# repo and run a workspace-wide `pnpm install`, so EVERY workspace
# node_modules dir must be shadowed by a container-only anonymous volume —
# otherwise the container writes Linux symlinks into the host's node_modules
# and breaks native (Windows) tooling. Keep this list in sync with
# pnpm-workspace.yaml. Both apps' .next dirs are isolated as well.
x-node-dev-volumes: &node-dev-volumes
  - .:/app
  - /app/node_modules
  - /app/apps/web/node_modules
  - /app/apps/web/.next
  - /app/apps/admin/node_modules
  - /app/apps/admin/.next
  - /app/packages/ui/node_modules
  - /app/packages/config/node_modules
  - /app/packages/api-client/node_modules

x-node-dev-environment: &node-dev-environment
  NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
  API_URL: http://backend:8080
  # Docker Desktop does not forward file-change events across the Windows/macOS
  # bind mount; make the Next 14 dev server (watchpack) poll instead.
  WATCHPACK_POLLING: "true"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookhaven-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookhaven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookhaven}
      POSTGRES_DB: ${POSTGRES_DB:-bookhaven}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookhaven} -d ${POSTGRES_DB:-bookhaven}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookhaven-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: bookhaven-backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-bookhaven}:${POSTGRES_PASSWORD:-bookhaven}@postgres:5432/${POSTGRES_DB:-bookhaven}?sslmode=disable
      REDIS_URL: redis:6379
      # Public web origin used for links in emails (e.g. /verify-email).
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      # AI pre-moderation (off by default; the api only reports status and
      # queues checks, it never calls the model). Needs the same flag and key
      # as the worker, otherwise the UI hides the «Проверить ИИ» buttons.
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-claude-haiku-5-5}
      AI_MODERATION_CRON: ${AI_MODERATION_CRON:-*/30 * * * *}
      AI_MODERATION_BATCH: ${AI_MODERATION_BATCH:-50}
      # AI curator of author import lists (off by default; shares
      # ANTHROPIC_API_KEY). The api stores requests and queues them; it needs
      # the same flag as the worker, otherwise requests end as timeout.
      AI_CURATOR_ENABLED: ${AI_CURATOR_ENABLED:-false}
      AI_CURATOR_MODEL: ${AI_CURATOR_MODEL:-claude-haiku-5-5}
      AI_DESCRIPTIONS_ENABLED: ${AI_DESCRIPTIONS_ENABLED:-false}
      AI_DESCRIPTIONS_MODEL: ${AI_DESCRIPTIONS_MODEL:-claude-sonnet-5-5}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - go-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["air", "-c", ".air.toml"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: bookhaven-worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-bookhaven}:${POSTGRES_PASSWORD:-bookhaven}@postgres:5432/${POSTGRES_DB:-bookhaven}?sslmode=disable
      REDIS_URL: redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: BookHaven <noreply@bookhaven.local>
      # Scheduled harvest of flagged authors (off by default: no surprise
      # outbound Wikidata/Open Library traffic in dev). Single worker only.
      HARVEST_SCHEDULE_ENABLED: ${HARVEST_SCHEDULE_ENABLED:-false}
      HARVEST_SCHEDULE_CRON: ${HARVEST_SCHEDULE_CRON:-0 4 * * *}
      HARVEST_SCHEDULE_BATCH: ${HARVEST_SCHEDULE_BATCH:-10}
      # AI pre-moderation of pending books (off by default; also needs
      # ANTHROPIC_API_KEY). The worker runs the sweep and the model calls.
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-claude-haiku-5-5}
      AI_MODERATION_CRON: ${AI_MODERATION_CRON:-*/30 * * * *}
      AI_MODERATION_BATCH: ${AI_MODERATION_BATCH:-50}
      # AI curator of author import lists (off by default; shares
      # ANTHROPIC_API_KEY). The worker makes the model and Wikidata calls.
      AI_CURATOR_ENABLED: ${AI_CURATOR_ENABLED:-false}
      AI_CURATOR_MODEL: ${AI_CURATOR_MODEL:-claude-haiku-5-5}
      AI_DESCRIPTIONS_ENABLED: ${AI_DESCRIPTIONS_ENABLED:-false}
      AI_DESCRIPTIONS_MODEL: ${AI_DESCRIPTIONS_MODEL:-claude-sonnet-5-5}
    volumes:
      - ./backend:/app
      - go-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Hot reload via air (own config/binary so it doesn't clash with the api's ./tmp/main).
    command: ["air", "-c", ".air.worker.toml"]

  # Local SMTP catcher: every email the worker sends shows up in the web UI
  # at http://localhost:8025 (nothing is delivered to real inboxes).
  mailpit:
    image: axllent/mailpit
    container_name: bookhaven-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.node
      target: dev
    container_name: bookhaven-web
    environment: *node-dev-environment
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes: *node-dev-volumes
    depends_on:
      - backend
    command: ["sh", "-c", "pnpm install --config.confirmModulesPurge=false && pnpm --filter web run dev"]

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.node
      target: dev
    container_name: bookhaven-admin
    environment: *node-dev-environment
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    volumes: *node-dev-volumes
    depends_on:
      - backend
    command: ["sh", "-c", "pnpm install --config.confirmModulesPurge=false && pnpm --filter admin run dev"]

volumes:
  postgres-data:
  redis-data:
  go-cache:
